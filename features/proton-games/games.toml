# Per-game Proton prefix settings, applied by `./proton-prefix.py apply`.
# Add a game only after the fix is confirmed in play.
#
#   appid         Steam app id
#   exe           game executable name (needed for grab_pointer)
#   grab_pointer  false = Wine does not grab the pointer for this game
#   output        PulseAudio sink the game should open ("default" removes it)

[[game]]
appid = 311210
name = "Call of Duty: Black Ops III"
exe = "BlackOps3.exe"
grab_pointer = false
output = "alsa_output.usb-SteelSeries_SteelSeries_Arctis_7-00.stereo-game"
